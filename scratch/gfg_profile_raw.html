.__next_f.push([1,"16:T6c1,"])</script><script>self.__next_f.push([1,"\u003cp class=\"break-words white-space-pre-wrap t-black--light text-body-medium\"\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eInvoicemart is a digital invoice discounting platform by A. TREDS (Trade Receivable Discounting System) Ltd, a joint venture between Axis Bank and B2B e-commerce company mjunction. It is a platform which connects MSME suppliers (sellers) and their corporate buyers to multiple financiers. This platform enables discounting of invoices of the MSME sellers against large buyers who are in the ERP system, through a transparent auction mechanism that ensures assertion of the billing at competitive market rates. The platform allows MSME suppliers to avail loans quickly and at competitive interest rates which will in turn helps increase their working capital efficiency without impacting their relationship with their buyers. The integrated customer ERP systems empowers it sellers, buyers and financiers, with the ease of doing business by reducing processing time for seamless transactions. Users/Customers also benefit from flexible repayment terms which help them manage their payables better. The platform makes sure that the buyers are top rated by leveraging their credit profile thus ensuring low risk of default. All the funds disbursed via Invoicemart qualify for priority sector lending. A. TReDS received approval from the RBI for operations in July, 2017. The key management team at Invoicemart includes Mr.Rajiv Anand, the Chairman \u0026amp; Mr.Prakash Sankaran, the Managing Director and CEO.\u003c/span\u003e\u003c/p\u003e\u003cdl class=\"overflow-hidden\"\u003e\u003cdt class=\"mb1\"\u003e\u003c/dt\u003e\u003c/dl\u003e"])</script><script>self.__next_f.push([1,"17:T24ad,"])</script><script>self.__next_f.push([1,"\u003ch2 da duct Delivery Manager to join its growing implementation and delivery team. As we experience exponential growth, we are looking for individuals having experience in implementing SaaS solutions for large, global enterprises. The ideal candidate will be an innovative self-starter comfortable working in a start-up environment and adept at managing client expectations. You will be the face of LogiNext to C-level executives and senior leaders of our enterprise clients.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou will develop the strategy behind implementations, and bring an obsession for exceeding customer expectations by delivering in accordance with project success metrics. You will also build long-term relationships with the clients, connecting with key business executives and stakeholders. You will liaise between clients, cross-functional internal teams and other system integrators to ensure the timely and successful delivery of our solutions according to customer needs.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eResponsibilities:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eWork with Business Development, Product Management and Engineering team to build highly scalable SaaS products and integration modules\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; f.push([1,"1d:T14d9,"])</script><script>self.__next_f.push([1,"\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eAbout the Role\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003eWe are seeking a \u003cstrong\u003eSenior PostgreSQL Database Administrator \u003c/strong\u003eto design, operate, and evolve highly available, scalable PostgreSQL platforms that support Fareportals global travel technology ecosystem. This role is critical to ensuring the availability, performance, and resilience of missioncritical database systems powering customers high volume, customer facing applications.\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003eThe ideal candidate brings \u003cstrong\u003edeep PostgreSQL expertise\u003c/strong\u003e,\u003cstrong\u003ehandson Patroni experience\u003c/strong\u003e, and a strong background in \u003cstrong\u003eproduction operations and advanced troubleshooting\u003c/strong\u003e. Experience with \u003cstrong\u003eMySQL \u003c/strong\u003ein enterprise environments \u003cstrong\u003eis highly desirable\u003c/strong\u003e.\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eKey Responsibilities\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003ePostgreSQL Architecture \u0026amp; Design\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eDesign and maintain scalable, faulttolerant PostgreSQL architectures aligned with clients business and growth strategy\u003c/li\u003e\u003cli\u003eDefine standards for PostgreSQL cluster design, configuration, versioning, and lifecycle management\u003c/li\u003e\u003cli\u003eArchitect and operate high availability PostgreSQL environments using Patroni with distributed consensus systems (etcd / Consul)\u003c/li\u003e\u003cli\u003eLead PostgreSQL upgrades, migrations, and platform modernization initiatives with minimal downtime\u003c/li\u003e\u003cli\u003eEvaluate and implement PostgreSQL extensions, features, and best practices suitable for largescale production workloads\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eOperations \u0026amp; Production Support (Primary Focus)\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eOwn the daytoday operational health of PostgreSQL platforms across production and nonproduction environments\u003c/li\u003e\u003cli\u003eLead major incident response, including failovers, performance degradation, replication issues, and data consistency problems\u003c/li\u003e\u003cli\u003ePerform deep root cause analysis (RCA) and drive longterm corrective and preventive actions\u003c/li\u003e\u003cli\u003eTune PostgreSQL for performance and stability, including:\u003c/li\u003e\u003cul\u003e\u003cli\u003eMemory and storage optimization\u003c/li\u003e\u003cli\u003eWAL and checkpoint tuning\u003c/li\u003e\u003cli\u003eAutovacuum and bloat management\u003c/li\u003e\u003cli\u003eQuery optimization and execution plan analysis\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eManage and validate backup, restore, and pointintime recovery strategies (pgBackRest, Barman, or equivalent)\u003c/li\u003e\u003cli\u003eAct as a senior escalation point during oncall rotations and highseverity production events\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003ePatroni \u0026amp; High Availability\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eDesign, configure, and operate \u003cstrong\u003ePatroni based PostgreSQL clusters \u003c/strong\u003ein production\u003c/li\u003e\u003cli\u003eTroubleshoot and resolve complex HA scenarios such as:\u003c/li\u003e\u003cul\u003e\u003cli\u003eLeader election failures\u003c/li\u003e\u003cli\u003eSplitbrain conditions\u003c/li\u003e\u003cli\u003eNetwork partitions and fencing issues\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eDefine and tune HA behavior (failover, switchover, synchronous replication settings)\u003c/li\u003e\u003cli\u003eEstablish safe maintenance, patching, and upgrade procedures for HA environments\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eAutomation, Monitoring \u0026amp; Reliability\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eDrive \u003cstrong\u003eautomation initiatives \u003c/strong\u003efor PostgreSQL provisioning, configuration, patching, and deployments\u003c/li\u003e\u003cli\u003eImplement proactive \u003cstrong\u003emonitoring and alerting \u003c/strong\u003efor performance, replication, capacity, and availability\u003c/li\u003e\u003cli\u003ePartner with SRE and infrastructure teams to improve platform reliability, alert quality, and operational tooling\u003c/li\u003e\u003cli\u003eDevelop and maintain \u003cstrong\u003eoperational documentation\u003c/strong\u003e, runbooks, and standard operating procedures\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eCrossDatabase Expertise (Desired)\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eProvide architectural and operational guidance for \u003cstrong\u003eMySQL platforms \u003c/strong\u003ewhere applicable\u003c/li\u003e\u003cli\u003eTroubleshoot MySQL performance, replication, and availability issues\u003c/li\u003e\u003cli\u003eSupport coexistence or migration strategies between PostgreSQL and MySQL environments\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eInfrastructure \u0026amp; Tooling\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eStrong Linux fundamentals\u003c/li\u003e\u003cli\u003eExperience with cloud or hybrid environments (AWS / Azure / GCP)\u003c/li\u003e\u003cli\u003eFamiliarity with monitoring tools (Prometheus, Grafana, Datadog, etc.)\u003c/li\u003e\u003cli\u003eScripting skills in Bash, Python, or similar\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"1e:T45d,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYUGroup Consulting (formerly Yellow Umbrella Group) is a specialist talent advisory firm with nearly a decade of experience in delivering high-impact hiring solutions across technology-driven sectors. Technology Hiring is at the core of what we do. We focus on niche and critical talent mandates across Semiconductor, EV, Electronics, and emerging technology domainswhere precision, speed, and deep market insight are essential. Our approach goes beyond conventional recruitment, combining targeted search, strong technical understanding, and a consultative mindset to solve complex hiring challenges. We partner with startups, scale-ups, and established enterprises to build high-performance teams that drive meaningful business outcomes. With a strong foundation in the NCR hiring ecosystem and a commitment to consistent delivery, we enable organizations to secure the right talentprecisely, reliably, and at scale\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1f:T12e8,"])</script><script>self.__next_f.push([1,"\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eAbout the Role\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003eWe are seeking a \u003cstrong\u003eJunior MySQL \u0026amp; PostgreSQL Database Administrator \u003c/strong\u003ewith around\u003cstrong\u003e1 year of hands-on experience \u003c/strong\u003eto support the operation, and maintenance of PostgreSQL and MySQL and other relational databases. This role is ideal for someone with good foundation in \u003cstrong\u003edatabase administration, database design concepts, and Linux systems comands\u003c/strong\u003e, while working under the guidance of senior DBAs.\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003eThe ideal candidate has a good understanding of \u003cstrong\u003eMySQL and PostgreSQL fundamentals\u003c/strong\u003e, basic \u003cstrong\u003edatabase design principles\u003c/strong\u003e, and is \u003cstrong\u003ecomfortable working in Linux environments\u003c/strong\u003e.\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRequired Skills \u0026amp; Qualifications\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003e\u003cstrong\u003e1 year of experience \u003c/strong\u003eworking with \u003cstrong\u003eMySQL and PostgreSQL\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eBasic understanding of \u003cstrong\u003erelational database fundamentals\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eFamiliarity with \u003cstrong\u003eLinux operating systems and standard Linux commands\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eBasic understanding of SQL Queries (Select, Insert, Update, Delete)\u003c/li\u003e\u003cli\u003eGood problem-solving and communication skills\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cem\u003e\u003cstrong\u003eKey Responsibilities\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eDatabase Administration \u0026amp; Operations\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eAssist in the \u003cstrong\u003eday-to-day administration \u003c/strong\u003eof MySQL and PostgreSQL databases in development, test, and production environments\u003c/li\u003e\u003cli\u003eMonitor database health, availability, and performance under senior DBA guidance\u003c/li\u003e\u003cli\u003ePerform routine DBA tasks such as:\u003c/li\u003e\u003cul\u003e\u003cli\u003eUser and role management\u003c/li\u003e\u003cli\u003eSchema changes and basic maintenance activities\u003c/li\u003e\u003cli\u003eLog review and alert investigation\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eSupport database \u003cstrong\u003estart/stop, backups, restores, and basic recovery tasks\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eDatabase Design \u0026amp; Development Support\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eUnderstand and apply \u003cstrong\u003edatabase design concepts\u003c/strong\u003e, including:\u003c/li\u003e\u003cul\u003e\u003cli\u003eNormalization and denormalization\u003c/li\u003e\u003cli\u003ePrimary keys, foreign keys, indexes, and constraints\u003c/li\u003e\u003cli\u003eAssist application teams with Table design and index recommendations\u003c/li\u003e\u003c/ul\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eBackup, Recovery \u0026amp; Maintenance\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eExecute and validate \u003cstrong\u003edatabase backup and restore procedures \u003c/strong\u003efor MySQL and PostgreSQL\u003c/li\u003e\u003cli\u003eAssist with \u003cstrong\u003epatching, minor upgrades, and version changes \u003c/strong\u003eunder supervision\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eLinux \u0026amp; System Support\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eWork in \u003cstrong\u003eLinux environments \u003c/strong\u003eto manage and support database systems\u003c/li\u003e\u003cli\u003eUse common \u003cstrong\u003eLinux commands \u003c/strong\u003efor:\u003c/li\u003e\u003cul\u003e\u003cli\u003eFile system navigation\u003c/li\u003e\u003cli\u003eLog analysis\u003c/li\u003e\u003cli\u003eProcess and disk usage monitoring\u003c/li\u003e\u003c/ul\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cstrong\u003e\u003cu\u003eMonitoring, Documentation \u0026amp; Support\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eRespond to \u003cstrong\u003ebasic database alerts and incidents\u003c/strong\u003e, escalating when required\u003c/li\u003e\u003cli\u003eMaintain \u003cstrong\u003edocumentation\u003c/strong\u003e, runbooks, and standard operating procedures\u003c/li\u003e\u003cli\u003eParticipate in knowledge-sharing and learning sessions with senior DBAs\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cu\u003eGood to Have (Nice-to-Have Skills)\u003c/u\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\u003cul style=\"font-weight: 400;\" data-mce-style=\"font-weight: 400;\"\u003e\u003cli\u003eExposure to MSSQL\u003c/li\u003e\u003cul\u003e\u003cli\u003eMonitoring tools (basic exposure is sufficient)\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eBasic scripting knowledge in \u003cstrong\u003eBash or Python\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eAwareness of cloud databases (AWS / Azure) is a plus\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"20:Ta14,"])</script><script>self.__next_f.push([1,"\u003cp data-start=\"170\" data-end=\"406\"\u003eWe are looking for a Desktop Support Engineer to provide end-user IT support and maintain desktop infrastructure. The candidate should have hands-on experience in troubleshooting desktops, laptops, printers, and basic networking issues.\u003c/p\u003e\u003ch3 data-section-id=\"164ueu3\" data-start=\"408\" data-end=\"432\"\u003eKey Responsibilities\u003c/h3\u003e\u003cul data-start=\"434\" data-end=\"1127\"\u003e\u003cli data-section-id=\"c24qtc\" data-start=\"434\" data-end=\"523\"\u003eInstallation, configuration, and troubleshooting of desktops, laptops, and perip 169dy0i\" data-start=\"1239\" data-end=\"1276\"\u003eMicrosoft Office \u0026amp; Outlook Support.\u003c/li\u003e\u003cli data-section-id=\"1kcrf4k\" data-start=\"1277\" data-end=\"1316\"\u003eBasic Networking (TCP/IP, DNS, DHCP).\u003c/li\u003e\u003cli data-section-id=\"1m6q7n9\" data-start=\"1317\" data-end=\"1355\"\u003ePrinter and Scanner Troubleshooting.\u003c/li\u003e\u003cli data-section-id=\"1ge94mk\" data-start=\"1356\" data-end=\"1404\"\u003eGood communication and problem-solving skills.\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"21:T19fc,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cem\u003e\u003cstrong\u003eRole Overview\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eWe are seeking an experienced .NET Developer to design, build, and maintain high-performance enterprise applications. You will work in an Agile team delivering Microsoft stack solutions with a focus on quality, scalability, and clean architecture.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eKey Responsibilities\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eDevelop and maintain web applications and APIs using ASP.NET Core, MVC, and C#.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eDesign and implement RESTful APIs and integrate with third-party systems.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eWork with SQL Server and/or other relational databases for data modelling and queries.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eParticipate in full software development lifecycle design, coding, testing, deployment.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eCollaborate with frontend teams to integrate backend services with UI layers.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eConduct code reviews and ensure adherence to coding standards and best practices.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eTroubleshoot, debug, and resolve performance bottlenecks and production issues.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eWrite unit and integration tests to ensure code reliability.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eMaintain technical documentation and contribute to architectural decisions.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cem\u003e\u003cstrong\u003eRequirements\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e2-4 years of hands-on experience with .NET Framework / .NET Core and C#.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eStrong knowledge of ASP.NET MVC, ASP.NET Core, and Web API development.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eProficiency in MS SQL Server, LINQ, and Entity Framework.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eUnderstanding of OOP principles, SOLID principles, and design patterns.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExperience with Git and Agile/Scrum development methodologies.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eAbility to write clean, testable, and well-documented code.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eBachelor's degree in Computer Science, IT, or equivalent.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cem\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eGood to Have\u003c/strong\u003e\u003c/span\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExperience with Azure services (App Service, Azure SQL, Azure DevOps).\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eFamiliarity with microservices, Docker, or Blazor is a bonus.\u003c/span\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"22:T15a2,"])</script><script>self.__next_f.push([1,"\u003ch3 style=\"text-align:left\"\u003e\u003cspan\u003eImportant Tips for Apti Preparation...🎯\u003c/span\u003e\u003c/h3\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003ch3 style=\"text-align:left\"\u003e\u003cspan\u003e🧠 Reasoning\u003c/span\u003e\u003c/h3\u003e\u003ch3 style=\"text-align:left\"\u003e\u003cspan\u003e📊 Quant\u003c/span\u003e\u003c/h3\u003e\u003ch3 style=\"text-align:left\"\u003e\u003cspan\u003e📖 English \u003c/span\u003e\u003c/h3\u003e\u003ch2 style=\"text-align:left\"\u003e\u003c/h2\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e✅ \u003c/span\u003e\u003cb\u003e\u003cstrong\u003eConsistency is more important than intensity.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eInstead of studying Aptitude for 3–4 hours on weekends, practice it daily for 20–30 minutes.\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e✅ \u003c/span\u003e\u003cb\u003e\u003cstrong\u003eContinuity is the key.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eReasoning, Quant, and English are skill-based subjects. The more regularly you practice, the faster and more accurate you become.\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e✅ \u003c/span\u003e\u003cb\u003e\u003cstrong\u003ePractice Daily.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eEven solving:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli value=\"1\"\u003e\u003cspan\u003e10 Reasoning questions\u003c/span\u003e\u003c/li\u003e\u003cli value=\"2\"\u003e\u003cspan\u003e10 Quant questions\u003c/span\u003e\u003c/li\u003e\u003cli value=\"3\"\u003e\u003cspan\u003e1 Reading Comprehension\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eevery day can create a significant improvement over a few months.\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e✅ \u003c/span\u003e\u003cb\u003e\u003cstrong\u003eFocus on Accuracy First, Speed Later.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eIn qualifying sections, avoiding negative marking is often more important than attempting every question.\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: start;\"\u003e\u003cspan\u003e \u003c/span\u003e\u003c/p\u003e\u003ch2 style=\"text-align:left\"\u003e\u003cspan\u003eTime Allocation Strategy\u003c/span\u003e\u003c/h2\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003eFor most Government IT exams:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e📚 \u003c/span\u003e\u003cb\u003e\u003cstrong\u003e20–30% Time\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e → Reasoning + Quant + English\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e💻 \u003c/span\u003e\u003cb\u003e\u003cstrong\u003e70–80% Time\u003c/strong\u003e\u003c/b\u003e\u003cspan\u003e → Technical Subjects (DBMS, Operating Systems, Computer Networks, OOPs, Software Engineering, DSA, SQL, etc.)\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cspan\u003e🎯 \u003c/span\u003e\u003cb\u003e\u003cstrong\u003eClear the qualifying section comfortably and maximize your score in the technical section.\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cblockquote\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e\"You don't need to be an Aptitude Expert. You need to be consistent enough to clear the qualifying cutoff and strong enough in Technical subjects to secure the final selection.\"\u003c/span\u003e\u003c/p\u003e\u003c/blockquote\u003e\u003cp style=\"text-align: start;\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\" style=\"text-align: start;\"\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"aptitude\" href=\"/community/hashtag/6374/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#aptitude\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"preparation\" href=\"/community/hashtag/13787/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#preparation\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"examexperiences\" href=\"/community/hashtag/17834/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#examexperiences\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e \u003c/span\u003e\u003cgfg-hashtag\u
